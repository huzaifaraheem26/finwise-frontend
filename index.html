<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FINWISE</title>
</head>
<body>
<script>
  /* Entry point / shared-link router.
     A brand-new visitor (no signed-in user stored on this device) is sent to
     the Login page. A returning, authenticated user goes straight to the
     Dashboard. Auth state is mirrored into localStorage at sign-in
     (see firebase-config.js -> persistUser), so this check works even though
     this page doesn't load the Firebase SDK. */
  (function () {
    // Honor an explicit logout first: after signing out we set this flag and
    // only clear it on a real interactive sign-in. It guarantees that reopening
    // the app link post-logout lands on Sign In even if a stale identity record
    // somehow lingers in localStorage. */
    try {
      if (localStorage.getItem("finwise:signedout") === "1") {
        window.location.replace("login.html");
        return;
      }
    } catch (e) {}

    var authed = false;
    try {
      var raw = localStorage.getItem("finwise:user");
      if (raw) {
        var u = JSON.parse(raw);
        authed = !!(u && (u.name || u.email));
      }
    } catch (e) { authed = false; }
    window.location.replace(authed ? "dashboard.html" : "login.html");
  })();
</script>
</body>
</html>
