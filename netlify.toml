[build]
  publish = "."

# This is a multi-page static site: every real route is an .html file that
# exists on disk (dashboard.html, transaction.html, …). Netlify serves those
# files directly, so refreshes and direct URLs to them work out of the box.
# The catch-all below only handles unknown paths (e.g. a stray /dashboard with
# no extension) by sending the visitor to the entry page instead of a raw 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never let a browser (especially mobile Safari/Chrome) cache our app logic.
# The JS files change without their filenames changing, so a cached copy would
# keep running old code after a deploy — which silently breaks auth/session and
# currency-sync fixes. Force a revalidation on every load.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Same for the HTML entry points so routing/auth-guard changes take effect
# immediately after a deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

